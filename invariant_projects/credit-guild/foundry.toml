[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc_version = "0.8.13"
auto_detect_solc = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@solmate/=lib/solmate/",
    "@src/=src/",
]
optimizer = true
optimizer_runs = 200
evm_version = "london"

[invariant]
runs = 200
depth = 120
fail_on_revert = false
call_override = false

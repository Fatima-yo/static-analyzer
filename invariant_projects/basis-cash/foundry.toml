[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc_version = "0.6.12"
auto_detect_solc = false
remappings = [
    "@openzeppelin/contracts/=src/openzeppelin/contracts/",
]
optimizer = true
optimizer_runs = 200
evm_version = "istanbul"

[invariant]
runs = 200
depth = 120
fail_on_revert = false
call_override = false

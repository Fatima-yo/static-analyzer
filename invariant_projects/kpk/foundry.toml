[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]

solc = "/home/fatima/Downloads/static-analyzer/solc_versions/solc-0.8.24"
evm_version = "paris"

optimizer = true
optimizer_runs = 200
via_ir = true

[invariant]
runs = 200
depth = 120
fail_on_revert = false
call_override = false
